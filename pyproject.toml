[project]
name = "elliptic"
version = "0.1.0"
description = "Detecting illicit Bitcoin transactions: a comparative study of supervised, graph and unsupervised methods on the Elliptic dataset"
authors = [
    { name = "Anes Berbic", email = "berbicanes6@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.12",
    "xgboost>=2.0",
    "torch>=2.3",
    "shap>=0.45",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tabulate>=0.10.0",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "jupyter>=1.0",
    "nbconvert>=7.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
